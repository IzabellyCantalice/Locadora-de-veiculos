<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Cliente - Locadora de Veículos</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    <div class="menu">
        <a href="/">Início</a>
        <a href="/marcas">Marcas</a>
        <a href="/carros">Carros</a>
        <a href="/clientes">Clientes</a>
        <a href="/locacoes">Locações</a>
    </div>

    <div class="conteudo">
        <h1>Cadastrar Novo Cliente</h1>

        <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{id}" />

            <label>Nome Completo:</label>
            <input type="text" th:field="*{nome}" placeholder="Ex: Maria Souza" />
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error"></span>

            <label>CPF:</label>
            <input type="text" th:field="*{cpf}" placeholder="000.000.000-00" />
            <span th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="error"></span>

            <label>Telefone:</label>
            <input type="text" th:field="*{telefone}" placeholder="(92) 99999-0000" />
            <span th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="error"></span>

            <div style="text-align: center; margin-top: 15px;">
                <input type="submit" value="Salvar Cliente" />
                <a href="/clientes">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Locadora de Veículos</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    <div class="menu">
        <a href="/">Início</a>
        <a href="/marcas">Marcas</a>
        <a href="/carros">Carros</a>
        <a href="/clientes">Clientes</a>
        <a href="/locacoes">Locações</a>
    </div>

    <div class="conteudo">
        <h1>Clientes Cadastrados</h1>
        <a href="/clientes/novo">Cadastrar Cliente</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.nome}"></td>
                    <td th:text="${c.cpf}"></td>
                    <td th:text="${c.telefone}"></td>
                    <td>
                        <a th:href="@{/clientes/excluir/{id}(id=${c.id})}"
                           onclick="return confirm('Excluir cliente?')">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
